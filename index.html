<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CBT Learning – Raw 15s</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  background: black;
  width: 100%;
  height: 100%;
}

.wrapper {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.video-frame {
  width: 360px;
  height: 640px;
  background: black;
}

video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
</style>
</head>

<body>

<div class="wrapper">
  <div class="video-frame">
    <video id="video" controls autoplay muted playsinline>
      <source src="videos/CBT%20learning%20Tool3.mp4" type="video/mp4">
      Your browser does not support HTML5 video.
    </video>
  </div>
</div>

<script>
const video = document.getElementById("video");

video.addEventListener("timeupdate", () => {
  if (video.currentTime >= 15) {
    video.pause();
  }
});
</script>

</body>
</html>
