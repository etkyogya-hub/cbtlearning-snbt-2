<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CBT Learning – FYP 15s</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  background: black;
  width: 100%;
  height: 100%;
  font-family: Arial, Helvetica, sans-serif;
}

.wrapper {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.video-frame {
  position: relative;
  width: 360px;
  height: 640px;
  background: black;
  overflow: hidden;
}

video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Overlay base */
.overlay {
  position: absolute;
  width: 100%;
  text-align: center;
  font-weight: bold;
  text-shadow: 0 2px 8px rgba(0,0,0,0.85);
  padding: 12px;
  box-sizing: border-box;
  display: none;
}

/* Hook */
#hook {
  top: 40%;
  font-size: 26px;
  color: white;
}

/* CTA */
#cta {
  bottom: 40px;
  font-size: 22px;
  color: yellow;
}

/* Subtitle */
#subtitle {
  bottom: 90px;
  font-size: 20px;
  color: white;
  background: rgba(0,0,0,0.55);
  border-radius: 10px;
  margin: 0 14px;
}
</style>
</head>

<body>

<div class="wrapper">
  <div class="video-frame">

    <video id="video" controls preload="metadata" playsinline>
      <source src="videos/CBT%20learning%20Tool3.mp4" type="video/mp4">
    </video>

    <div id="hook" class="overlay">
      CBT MANUAL ITU<br>SUDAH KETINGGALAN
    </div>

    <div id="subtitle" class="overlay"></div>

    <div id="cta" class="overlay">
      KOMENTAR “CBT”
    </div>

  </div>
</div>

<script>
const video = document.getElementById("video");
const hook = document.getElementById("hook");
const cta = document.getElementById("cta");
const subtitle = document.getElementById("subtitle");

/* Subtitle timeline */
const subtitles = [
  { start: 2, end: 4, text: "Bikin soal CBT manual itu ribet." },
  { start: 4, end: 6, text: "Setting jawaban, scoring, waktu…" },
  { start: 6, end: 9, text: "Di sini semuanya dipercepat." },
  { start: 9, end: 12, text: "Trainer & guru sudah pakai ini." }
];

video.addEventListener("timeupdate", () => {
  const t = video.currentTime;

  /* Hook */
  hook.style.display = (t >= 0 && t <= 2) ? "block" : "none";

  /* CTA */
  cta.style.display = (t >= 12 && t <= 15) ? "block" : "none";

  /* Subtitles */
  let active = subtitles.find(s => t >= s.start && t <= s.end);
  if (active) {
    subtitle.textContent = active.text;
    subtitle.style.display = "block";
  } else {
    subtitle.style.display = "none";
  }

  /* Stop at 15s */
  if (t >= 15) {
    video.pause();
  }
});
</script>

</body>
</html>
