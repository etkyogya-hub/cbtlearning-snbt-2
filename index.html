<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CBT Learning – Part 1</title>

<style>
html,body{margin:0;background:black;height:100%}
.wrapper{display:flex;justify-content:center;align-items:center;height:100vh}
.frame{position:relative;width:360px;height:640px;overflow:hidden}
video{width:100%;height:100%;object-fit:cover;transition:transform .15s}
.overlay{position:absolute;width:100%;text-align:center;font-weight:bold;
text-shadow:0 2px 8px rgba(0,0,0,.85);display:none;padding:12px}
#hook{top:40%;font-size:26px;color:white}
#cta{bottom:40px;font-size:22px;color:yellow}
</style>
</head>

<body>
<div class="wrapper">
<div class="frame">

<video id="v" controls preload="metadata" playsinline>
  <source src="videos/CBT%20learning%20Tool3.mp4" type="video/mp4">
</video>

<div id="hook" class="overlay">CBT MANUAL ITU<br>SUDAH KETINGGALAN</div>
<div id="cta" class="overlay">LANJUT PART 2 →</div>

</div>
</div>

<script>
const v=document.getElementById("v");
const hook=document.getElementById("hook");
const cta=document.getElementById("cta");

v.addEventListener("timeupdate",()=>{
  const t=v.currentTime;
  hook.style.display=(t<=2)?"block":"none";
  cta.style.display=(t>=12)?"block":"none";
  v.style.transform=(t>6)?"scale(1.06)":"scale(1)";
  if(t>=15)v.pause();
});
</script>
</body>
</html>
